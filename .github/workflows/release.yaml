name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Merges in quick succession release one after another, not in parallel.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semantic-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Create initial tag if missing
        run: |
          # Tag the root commit, so that all commits count for the first release
          if [ -z "$(git tag -l)" ]; then
            git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD)"
          fi

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -p semantic-release@24 \
            -p @semantic-release/commit-analyzer \
            -p @semantic-release/release-notes-generator \
            -p @semantic-release/exec \
            -p @semantic-release/github \
            semantic-release

  container:
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/_container-build.yaml
    with:
      image: ghcr.io/slauger/solarfocus-exporter
      dockerfile: Containerfile
      push: true
      sign: true
      tag: ${{ needs.semantic-release.outputs.version }}

  # Per-platform image SBOMs from the container job, attached to the release
  sbom-assets:
    needs:
      - semantic-release
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: gh release upload "v${VERSION}" sbom/*.json --clobber

  # Static binaries for common platforms, attached to the GitHub release
  binaries:
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.3

      - name: Build
        env:
          # Packages only: without this, every file becomes a CycloneDX component
          SYFT_FILE_METADATA_SELECTION: none
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            name="solarfocus-exporter_${VERSION}_${os}_${arch}"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/${name}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/${name}/solarfocus-exporter${ext}" ./cmd/solarfocus-exporter
            # CycloneDX SBOM of the binary, from its embedded Go build info
            syft scan "file:build/${name}/solarfocus-exporter${ext}" \
              --source-name solarfocus-exporter --source-version "${VERSION}" \
              -o "cyclonedx-json=dist/${name}.cdx.json"
            cp LICENSE README.md "build/${name}/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/${name}.zip" "${name}")
            else
              tar -C build -czf "dist/${name}.tar.gz" "${name}"
            fi
          done
          (cd dist && sha256sum ./* > checksums.txt)

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: gh release upload "v${VERSION}" dist/* --clobber

