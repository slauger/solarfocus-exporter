version: "2"

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dogsled
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - intrange
    - misspell
    - modernize
    - nakedret
    - nilerr
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
  settings:
    nolintlint:
      require-specific: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - gosec
      # German state texts (umlauts) are intentional
      - path: internal/solarfocus/states\.go
        linters:
          - asciicheck

formatters:
  enable:
    - gofmt
